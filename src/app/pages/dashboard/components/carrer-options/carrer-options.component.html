<div class="carrer-options">
    @for (carrerOption of carrerOptions; track carrerOption.name) {
        <div class="carrer-option">
            <a [routerLink]="[carrerOption.path]">
                <i><img src="assets/icons/carrerOption.icon" alt="carrerOption.name"></i>
                <span>{{ carrerOption.name }}</span>
            </a>
        </div>
    }
</div>
