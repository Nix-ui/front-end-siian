<div class="department-options">
    @for (departmentOption of departmentOptions; track departmentOption.name) {
        <div class="department-option">
            <a [routerLink]="[departmentOption.path]">
                <i><img src="assets/icons/departmentOption.icon" alt="departmentOption.name"></i>
                <span>{{ departmentOption.name }}</span>
            </a>
        </div>
    }
</div>
